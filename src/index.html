<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; media-src data:">
  <title>Tokemon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-source="demo">
  <main>
    <div class="pet-stage">
    <div id="status" role="status"><span data-i18n="m62">포켓몬을 데려오는 중…</span></div>
    <button id="pet" aria-label="피카츄: 클릭하면 울음소리, 드래그하면 이동, 오른쪽 클릭하면 메뉴" data-i18n-aria-label="m84" title="드래그로 이동 · 클릭하면 울음소리 · 우클릭 메뉴" data-i18n-title="m85">
      <span id="recall-pose"><span id="sprite-pose"><canvas id="sprite" width="144" height="144" aria-hidden="true" hidden></canvas><canvas id="evolution-preview" width="144" height="144" aria-hidden="true" hidden></canvas></span></span>
      <canvas id="recall-fx" width="176" height="160" aria-hidden="true"></canvas>
      <span id="pokeball" aria-hidden="true">
        <span class="ball-shadow"></span>
        <svg class="ball-shell" viewBox="0 0 32 32" shape-rendering="crispEdges">
          <g class="ball-bottom"><path fill="#303341" d="M2 15H30V23H28V27H24V29H20V31H12V29H8V27H4V23H2Z"/><path fill="#fff8e5" d="M4 17H28V23H26V25H22V27H18V29H12V27H8V25H6V21H4Z"/><path fill="#b2bdc9" d="M26 18H28V23H26V25H22V27H18V29H12V27H20V25H24V21H26Z"/></g>
          <g class="ball-top"><path fill="#303341" d="M2 17V11H4V7H8V3H12V1H20V3H24V5H28V9H30V17Z"/><path fill="#e95b56" d="M4 14V11H6V7H10V5H14V3H20V5H24V7H26V11H28V14Z"/><path fill="#ba374b" d="M24 7H26V11H28V14H20V12H24Z"/><path fill="#ffb3a0" d="M8 8H12V6H18V8H12V10H8Z"/><path fill="#303341" d="M2 14H30V18H2Z"/></g>
          <g class="ball-button"><path fill="#303341" d="M12 11H20V13H22V21H20V23H12V21H10V13H12Z"/><path fill="#fff8e5" d="M13 13H19V15H20V19H18V21H14V19H12V15H13Z"/><path class="ball-light" fill="#d5dfda" d="M14 15H18V19H14Z"/></g>
        </svg>
      </span>
      <span id="placeholder">⚡</span>
    </button>
    <div id="volume-panel" role="group" aria-label="볼륨" data-i18n-aria-label="m86" hidden>
      <label for="volume"><span data-i18n="m86">볼륨</span><output id="volume-value" for="volume">100%</output></label>
      <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="볼륨" data-i18n-aria-label="m86">
    </div>
    <button id="mute" type="button" aria-pressed="false" aria-expanded="false" aria-controls="volume-panel" aria-label="음소거" data-i18n-aria-label="m73" title="클릭: 음소거 · 길게 누르기: 볼륨" data-i18n-title="m87">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">
        <path fill="currentColor" d="M2 6H5V5H6V4H7V3H8V13H7V12H6V11H5V10H2Z"/>
        <path class="mute-waves" fill="currentColor" d="M10 6H11V10H10Z"/>
        <path class="mute-waves mute-wave-far" fill="currentColor" d="M12 4H13V12H12Z"/>
        <path class="mute-cross" fill="currentColor" d="M10 6H11V7H10ZM14 6H15V7H14ZM11 7H12V8H11ZM13 7H14V8H13ZM12 8H13V9H12ZM11 9H12V10H11ZM13 9H14V10H13ZM10 10H11V11H10ZM14 10H15V11H14Z"/>
      </svg>
    </button>
    </div>
    <section id="health" aria-label="토큰 잔여량 미연동, 예시 체력 바" data-i18n-aria-label="m88" title="토큰 잔여량 연동 전의 예시입니다" data-i18n-title="m37">
      <div class="health-heading"><span id="species-label">피카츄</span><span id="level">Lv.1</span></div>
      <div class="health-row"><span class="hp-label">HP</span><div class="health-gauge"><div class="health-track" role="meter" aria-label="예시 잔여량" data-i18n-aria-label="m89" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div class="health-fill"></div></div><div class="weekly-track" role="meter" aria-label="주간 잔여량" data-i18n-aria-label="m90" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" hidden><div class="weekly-fill"></div></div></div></div>
      <div id="limit-legend" hidden><span id="short-value"></span><span id="weekly-value"></span></div>
      <div class="exp-row"><span class="exp-label">EXP</span><div class="exp-track" role="progressbar" aria-label="다음 레벨까지 경험치" data-i18n-aria-label="m91" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="exp-fill"></div></div></div>
      <div class="growth-detail"><span id="state-label"><span data-i18n="m0">활발</span></span><span id="exp-value">0 / 100</span></div>
    </section>
    <nav class="commerce-nav" aria-label="아이템 메뉴" data-i18n-aria-label="m92">
      <button id="open-bag" type="button"><span data-i18n="m14">가방</span></button><button id="open-shop" type="button"><span data-i18n="m15">상점</span></button>
    </nav>
    <section class="preview" aria-label="토큰 미연동 상태 체험" data-i18n-aria-label="m93">
      <label id="remaining-label" for="remaining"><span data-i18n="m98">잔여량 체험</span><output id="remaining-value" for="remaining">100%</output></label>
      <input id="remaining" type="range" min="0" max="100" step="1" value="100" aria-label="체험용 잔여 토큰 비율" data-i18n-aria-label="m94">
      <form id="token-form">
        <label for="token-input"><span data-i18n="m99">사용 토큰 체험</span></label>
        <div class="token-controls"><input id="token-input" type="number" min="1" max="1000000" step="1" value="1000" required aria-label="추가할 체험용 토큰 수" data-i18n-aria-label="m95"><button id="token-add" type="submit"><span data-i18n="m100">추가</span></button></div>
      </form>
      <span id="limit-note" role="status"></span>
      <span id="evolution-hint"><span data-i18n="m101">우클릭 → 포켓몬 선택</span></span>
      <span id="source-note" class="preview-note"><span data-i18n="m36">실제 토큰 미연동</span></span>
    </section>
  </main>
  <dialog id="commerce" aria-labelledby="commerce-title">
    <header class="commerce-header"><h1 id="commerce-title"><span data-i18n="m14">가방</span></h1><button id="close-commerce" type="button" aria-label="닫기" data-i18n-aria-label="m96">×</button></header>
    <div class="wallet"><span><span data-i18n="m102">보유 토큰</span></span><strong id="wallet-balance">0</strong></div>
    <details id="demo-wallet-tools"><summary><span data-i18n="m103">체험용 잔액 설정</span></summary>
    <form id="demo-wallet">
      <label for="demo-balance"><span data-i18n="m104">체험용 보유 토큰 설정</span></label>
      <input id="demo-balance" type="number" min="0" max="1000000000000" step="1" value="1000000" required>
      <button id="set-demo-balance" type="submit"><span data-i18n="m105">잔액 설정</span></button>
      <small><span data-i18n="m106">EXP 변화 없이 잔액만 바뀌어요.</span></small>
    </form>
    </details>
    <div class="commerce-tabs" aria-label="가방과 상점" data-i18n-aria-label="m97"><button id="bag-tab" type="button"><span data-i18n="m14">가방</span></button><button id="shop-tab" type="button"><span data-i18n="m15">상점</span></button></div>
    <p id="commerce-description"></p>
    <p id="commerce-feedback" role="status" aria-live="polite"></p>
    <div id="item-list"></div>
    <p class="commerce-footnote"><span data-i18n="m107">사용 토큰 1개 = 보유 토큰 1개</span><br><span data-i18n="m108">구매해도 EXP는 유지돼요.</span></p>
  </dialog>
  <script src="i18n.js"></script>
  <script src="animation.js"></script>
  <script src="growth-audio.js"></script>
  <script src="recall.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
